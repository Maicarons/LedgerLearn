AutoName: LedgerLearn
Name: LedgerLearn
Summary: Accounting learning simulation for beginners (China ASBE)
Description: |-
  LedgerLearn is a multilingual accounting education app for beginners.
  Learn double-entry bookkeeping through hands-on simulation: vouchers,
  ledgers, trial balance, and financial statements following China's
  Accounting Standards for Business Enterprises (ASBE).

  IMPORTANT: Chart of accounts and lessons follow Chinese Mainland
  accounting practice and may not apply to other jurisdictions.

  Features:
  * Voucher entry with debit/credit balance checks and business templates
  * 62 preset ASBE accounts, plus custom accounts
  * General ledger and subsidiary ledger
  * Trial balance, income statement, balance sheet
  * Period-end closing wizard and report charts
  * Practice drills with auto-grading and a wrong-answer book
  * 70+ knowledge cards (practice / law / tax) with Markdown
  * CSV/PDF export
  * UI languages: Chinese, English, Korean, Japanese, Vietnamese, Thai
  * Light / dark / system themes
  * Offline-first local storage

